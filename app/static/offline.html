<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152f">
  <title>You’re offline — Rail Sathi</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #18243a; background: #f7f8fa; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(90%, 420px); padding: 36px; border: 1px solid #e7eaf0; border-radius: 18px; background: #fff; text-align: center; box-shadow: 0 18px 48px #12213a12; }
    .offline-logo { display:block; width:min(100%, 230px); height:78px; margin:0 auto 20px; object-fit:contain; }
    h1 { color: #07152f; }
    p { color: #667085; line-height: 1.65; }
    a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 9px; background: #e93434; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img class="offline-logo" src="/static/images/rail-sathi-logo.png" alt="Rail Sathi">
    <h1>You’re offline</h1>
    <p>Rail Sathi needs an internet connection to load current station services and booking information. Your account and trip details are not stored for offline viewing.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
